<!-- Tipografía: preconnect + stylesheet (más rápido que @import dentro del CSS) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}" sizes="any">

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Logo dentro del título del sitio (sin tocar)
    const titleLink = document.querySelector('.site-title');
    if (titleLink && !titleLink.querySelector('img')) {
      const img = document.createElement('img');
      img.src = "{{ '/assets/img/logotipo.png' | relative_url }}";
      img.alt = "Logo";
      img.className = "site-logo";
      titleLink.prepend(img);
    }

    // Reveal sutil al hacer scroll (sin librerías externas)
    const revealEls = document.querySelectorAll('.reveal');
    if (revealEls.length && 'IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      revealEls.forEach(el => io.observe(el));
    } else {
      revealEls.forEach(el => el.classList.add('is-visible'));
    }
  });
</script>
